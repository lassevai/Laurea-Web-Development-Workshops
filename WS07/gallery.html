<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Aurora Photography</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
</head>
<body id="body">
    <header>
        <nav id="fixed-nav" class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
            <a class="navbar-brand" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/">Aurora Photography</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <main id="main">
        <div class="gallery-container">
            <div class="gallery-section">
                <h1 class="gallery-heading">Nature</h1>
                <div class="swiper Swiper1"> 
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="nature1.JPG" alt="Two deer in a foggy landscape">
                    </div>
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="nature2.jpg" alt="A close up shot of a bird">
                    </div>
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="nature3.jpg" alt="A close up shot of a bird on a branch">
                    </div>
                </div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                </div>
            </div>
            <div class="gallery-section">
                <h2 class="gallery-heading text-align">Events</h2>
                <div class="swiper Swiper1"> 
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="events1.jpg" alt="A dark photo depicting a person">
                    </div>
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="events2.jpg" alt="A close up shot of a microphone">
                    </div>
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="events3.jpg" alt="A close up shot of a person performing on a stage">
                    </div>
                </div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                </div>
            </div>
            <div class="gallery-section">
                <h2 class="gallery-heading">Weddings</h2>
                <div class="swiper Swiper1"> 
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="wedding1.jpg" alt="Multiple persons raising a glass">
                    </div>
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="wedding2.jpg" alt="A person holding a bouquet of flowers">
                    </div>
                    <div class="swiper-slide">
                        <img class="slider-photo grid-photo" src="wedding3.jpg" alt="Two persons holding hands with wedding rings in focus">
                    </div>
                </div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <a class="footer-logo-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/">Aurora Photography </a>
            </div>
            <div class="footer-nav">
                <ul class="footer-list">
                    <li>
                        <a class="footer-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/">Home</a>
                    </li>
                    <li>
                        <a class="footer-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/gallery.html">Gallery</a>
                    </li>
                    <li>
                        <a class="footer-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/about.html">About</a>
                    </li>
                    <li>
                        <a class="footer-link" href="https://lassevai.github.io/Laurea-Web-Development-Workshops/WS07/contact.html">Contact</a>
                    </li>
                </ul>
            </div>
            <div class="footer-copyright">
                <span class="footer-copyright-text">© 2026 Aurora Photography</span>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script> 
        var swiper = new Swiper(".Swiper1", {
            pagination: {
                el: '.swiper-pagination',
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
</body>
</html>
